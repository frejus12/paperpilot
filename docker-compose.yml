services:
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  ui:
    build: .
    ports: ["8501:8501"]
    env_file: .env
    environment:
      PAPERPILOT_API_URL: http://api:8000
    volumes: ["./data:/app/data"]
    depends_on:
      api:
        condition: service_healthy
